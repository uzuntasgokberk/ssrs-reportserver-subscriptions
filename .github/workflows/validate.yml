name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: ASCII only (Windows PowerShell 5.1 reads files without BOM as ANSI)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1, *.psd1) {
            $bad = @([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }).Count
            if ($bad -gt 0) { Write-Error "$($f.Name): $bad non-ASCII byte(s)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          "ASCII only."

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name) line $($_.Extent.StartLineNumber): $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
          "No parse errors."

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name) line $($_.Extent.StartLineNumber): $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
          "No parse errors."

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { exit 1 }
          "No findings."
